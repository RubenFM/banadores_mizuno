name: Buscar bañadores

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 9:00 en invierno, 10:00 en verano (Espana)
  workflow_dispatch:       # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write   # guardar historico.json
  issues: write     # abrir la issue con los nuevos

concurrency: buscar

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: Buscar en Mercari
        run: python3 buscar.py --historico historico.json --markdown nuevos.md

      - name: Abrir issue si hay nuevos
        if: hashFiles('nuevos.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(grep -c '^| ¥' nuevos.md)
          gh issue create --title "$n bañador(es) nuevo(s) - $(date +%F)" --body-file nuevos.md

      - name: Guardar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || { git commit -m "historico: $(date +%F)" && git push; }
